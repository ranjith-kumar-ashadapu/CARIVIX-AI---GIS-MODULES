<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GIS Boundary Integration & Rendering Test</title>
  <!-- 1. Load MapLibre CSS -->
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />

  <!-- 2. Load MapLibre JavaScript -->
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
    #layer-menu {
      position: absolute; top: 10px; left: 10px; z-index: 1;
      background: #fff; padding: 14px 18px; border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      line-height: 1.6;
      font-size: 13px;
      min-width: 170px;
    }
    .zoom-display {
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px solid #ddd;
      font-weight: bold;
      color: #2b2b2b;
    }
  </style>
</head>
<body>

<div id="layer-menu">
  <strong>Layer Controls</strong><br>
  <input type="checkbox" id="toggle-states" checked>
  <label for="toggle-states">States (Level 1)</label><br>
  <input type="checkbox" id="toggle-districts" checked>
  <label for="toggle-districts">Districts (Level 2)</label><br>
  <input type="checkbox" id="toggle-subdistricts" checked>
  <label for="toggle-subdistricts">Sub-Districts (Level 3)</label><br>
  <input type="checkbox" id="toggle-heatmap" checked>
  <label for="toggle-heatmap">Heatmap & Points</label>

  <!-- Dynamic Zoom Display -->
  <div class="zoom-display">
    Zoom Level: <span id="zoom-level">7.0</span>
  </div>
</div>

<div id="map"></div>

<script>
  const map = new maplibregl.Map({
    container: 'map',
    style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
    center: [79.0193, 18.1124], // Center of Telangana
    zoom: 7
  });

  map.addControl(new maplibregl.NavigationControl(), 'top-right');

  map.on('load', () => {
  // 1. Level 3: Sub-Districts
  map.addSource('subdistricts', {
    type: 'geojson',
    data: 'http://localhost:8000/api/v1/boundaries/3'
  });

    map.addLayer({
      id: 'subdistricts-outline',
      type: 'line',
      source: 'subdistricts',
      paint: {
        'line-color': '#7570b3',
        'line-width': 0.8,
        'line-dasharray': [2, 2]
      }
    });

    // 2. Level 2: Districts
  map.addSource('telangana-districts', {
    type: 'geojson',
    data: 'http://localhost:8000/api/v1/boundaries/2'
  });

    map.addLayer({
      id: 'districts-fill',
      type: 'fill',
      source: 'telangana-districts',
      paint: {
        'fill-color': '#ff7800',
        'fill-opacity': 0.15
      }
    });

    map.addLayer({
      id: 'districts-outline',
      type: 'line',
      source: 'telangana-districts',
      paint: {
        'line-color': '#d95f02',
        'line-width': 1.5
      }
    });

    // 3. Level 1: States
  map.addSource('state-boundaries', {
    type: 'geojson',
    data: 'http://localhost:8000/api/v1/boundaries/1'
  });

    map.addLayer({
      id: 'states-outline',
      type: 'line',
      source: 'state-boundaries',
      paint: {
        'line-color': '#111111',
        'line-width': 2.5
      }
    });

    // 4. Sample Points & Heatmap
  map.addSource('sample-points', {
    type: 'geojson',
    data: 'http://localhost:8000/api/v1/points/sample'
  });

    // Heatmap Layer
    map.addLayer({
      id: 'heatmap-layer',
      type: 'heatmap',
      source: 'sample-points',
      paint: {
        'heatmap-weight': ['interpolate', ['linear'], ['get', 'weight'], 0, 0, 10, 1],
        'heatmap-intensity': ['interpolate', ['linear'], ['zoom'], 0, 1, 15, 3],
        'heatmap-color': [
          'interpolate', ['linear'], ['heatmap-density'],
          0, 'rgba(0, 0, 255, 0)',
          0.2, 'rgb(103, 169, 207)',
          0.4, 'rgb(209, 229, 240)',
          0.6, 'rgb(253, 219, 199)',
          0.8, 'rgb(239, 138, 98)',
          1, 'rgb(178, 24, 43)'
        ],
        'heatmap-radius': ['interpolate', ['linear'], ['zoom'], 0, 5, 15, 35],
        'heatmap-opacity': ['interpolate', ['linear'], ['zoom'], 11, 0.8, 14, 0]
      }
    });

    // Point Marker Layer
    map.addLayer({
      id: 'point-marker-layer',
      type: 'circle',
      source: 'sample-points',
      minzoom: 10,
      paint: {
        'circle-color': '#e63946',
        'circle-radius': 6,
        'circle-stroke-width': 2,
        'circle-stroke-color': '#ffffff',
        'circle-opacity': ['interpolate', ['linear'], ['zoom'], 10, 0, 13, 1]
      }
    });

    // 5. Add Click Popups for District Names
    map.on('click', 'districts-fill', (e) => {
      const properties = e.features[0].properties;
      const districtName = properties.NAME_2 || 'Unknown District';
      const stateName = properties.NAME_1 || 'Unknown State';

      new maplibregl.Popup()
        .setLngLat(e.lngLat)
        .setHTML(`<strong>District:</strong> ${districtName}<br><strong>State:</strong> ${stateName}`)
        .addTo(map);
    });

    // Change cursor on hover
    map.on('mouseenter', 'districts-fill', () => { map.getCanvas().style.cursor = 'pointer'; });
    map.on('mouseleave', 'districts-fill', () => { map.getCanvas().style.cursor = ''; });

    // 6. Layer Visibility Toggle Listeners
    document.getElementById('toggle-states').addEventListener('change', (e) => {
      const visibility = e.target.checked ? 'visible' : 'none';
      map.setLayoutProperty('states-outline', 'visibility', visibility);
    });

    document.getElementById('toggle-districts').addEventListener('change', (e) => {
      const visibility = e.target.checked ? 'visible' : 'none';
      map.setLayoutProperty('districts-fill', 'visibility', visibility);
      map.setLayoutProperty('districts-outline', 'visibility', visibility);
    });

    document.getElementById('toggle-subdistricts').addEventListener('change', (e) => {
      const visibility = e.target.checked ? 'visible' : 'none';
      map.setLayoutProperty('subdistricts-outline', 'visibility', visibility);
    });

    document.getElementById('toggle-heatmap').addEventListener('change', (e) => {
      const visibility = e.target.checked ? 'visible' : 'none';
      map.setLayoutProperty('heatmap-layer', 'visibility', visibility);
      map.setLayoutProperty('point-marker-layer', 'visibility', visibility);
    });

    // 7. Dynamic Zoom Level Indicator Listener
    const zoomDisplay = document.getElementById('zoom-level');
    map.on('zoom', () => {
      zoomDisplay.innerText = map.getZoom().toFixed(1);
    });
  });
</script>

</body>
</html>
